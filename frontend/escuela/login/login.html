<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reformat - Login Escuela</title>

    <link rel="stylesheet"
          href="../css/main.css">

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>Escuela Reformat</h1>

            <p>
                Inicia sesión para continuar
            </p>

            <p id="loginMessage" role="alert" aria-live="polite"></p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn">

                    Ingresar

                </button>

            </form>

        </div>

    </main>


    <script src="login.js" defer></script>

</body>

</html>
